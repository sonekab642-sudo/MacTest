name: Launch Mac Ternal with Hot-Reload

on:
  workflow_dispatch:

jobs:
  run-mac-terminal:
    runs-on: macos-14
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install gradio psutil pygments ansi2html

      - name: Download & Setup Cloudflare Tunnel
        run: |
          curl -L --output cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xvzf cloudflared.tgz
          chmod +x cloudflared

      - name: Launch Hot-Reload Engine & Tunnel
        run: |
          # ১. ক্লাউডফ্লেয়ার টানেল চালু করা (এটি একটানা সচল থাকবে)
          ./cloudflared tunnel --url http://localhost:7860 --logfile cf.log &
          
          # ২. টানেল লিংক বের করা
          sleep 6
          echo "=========================================================="
          echo "🚀 আপনার পার্মানেন্ট লাইভ লিঙ্ক:"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' cf.log | head -n 1
          echo "=========================================================="

          # ৩. প্রথমবারের মতো app.py রান করা
          python3 app.py &
          APP_PID=$!

          # ৪. 🔄 অটো-ওয়াচার লুপ (প্রতি ১০ সেকেন্ড পর পর গিটহাব চেক করবে)
          echo "🔄 অটো-রিলোড ইঞ্জিন চালু হয়েছে! app.py এডিট করলেই স্বয়ংক্রিয়ভাবে আপডেট হবে..."
          
          while true; do
            sleep 10
            git fetch origin main -q 2>/dev/null || git fetch origin master -q 2>/dev/null
            
            # বর্তমান ও নতুন কমিট চেক
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse @{u} 2>/dev/null || echo "$LOCAL")
            
            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "⚡ নতুন কোড পাওয়া গেছে! app.py অটো-রিলোড হচ্ছে..."
              git reset --hard @{u} -q
              
              # পুরনো app.py বন্ধ করা
              kill -9 $APP_PID 2>/dev/null || true
              pkill -f "python3 app.py" 2>/dev/null || true
              sleep 1
              
              # নতুন app.py ব্যাকগ্রাউন্ডে চালু করা
              python3 app.py &
              APP_PID=$!
              echo "✅ app.py সফলভাবে রিস্টার্ট হয়েছে! ব্রাউজার রিফ্রেশ করলেই নতুন কোড লাইভ!"
            fi
          done
