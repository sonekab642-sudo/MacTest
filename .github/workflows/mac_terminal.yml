name: Launch Mac Ternal with Cloudflare

on:
  workflow_dispatch: # হাত দিয়ে ১ ক্লিকে রান করার জন্য

jobs:
  run-mac-terminal:
    runs-on: macos-14 # খাঁটি অ্যাপল সিলিকন M1/M2 ম্যাক!
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install gradio psutil pygments ansi2html

      - name: Download & Setup Cloudflare Tunnel for Apple Silicon
        run: |
          curl -L --output cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xvzf cloudflared.tgz
          chmod +x cloudflared

      - name: Launch Ternal & Expose Public URL
        run: |
          # ১. ব্যাকগ্রাউন্ডে গ্রাডিও ম্যাক টার্মিনাল রান করা
          python app.py &
          
          # ২. গ্রাডিও পুরোপুরি বুট হওয়ার জন্য কয়েক সেকেন্ড অপেক্ষা
          sleep 5

          # ৩. ব্যাকগ্রাউন্ডে ক্লাউডফ্লেয়ার টানেল চালু করা
          ./cloudflared tunnel --url http://localhost:7860 --logfile cf.log &

          # ৪. ক্লাউডফ্লেয়ার লিঙ্ক তৈরি হওয়া পর্যন্ত অপেক্ষা ও লগ থেকে বের করা
          echo "Waiting for Cloudflare Tunnel to generate URL..."
          sleep 8
          
          echo "=========================================================="
          echo "🚀 আপনার লাইভ ম্যাক টার্মিনাল লিঙ্ক নিচে তৈরি হয়ে গেছে:"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' cf.log | head -n 1
          echo "=========================================================="

          # ৫. ৬ ঘণ্টা সেশনকে জ্যান্ত রাখা যাতে আপনি আরামসে মোবাইল থেকে চালাতে পারেন
          sleep 21600
