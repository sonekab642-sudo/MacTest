name: Mac Runner - Fully Automatic (24/7)

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 */6 * * *'  # কোনো কারণে বন্ধ হলে প্রতি ৬ ঘণ্টায় অটো ব্যাকআপ
  workflow_dispatch:       # স্ক্রিপ্টটি নিজে নিজেকে স্বয়ংক্রিয় রিস্টার্ট করার জন্য এটি ব্যাকগ্রাউন্ডে দরকার

# ডুপ্লিকেট রান প্রতিরোধ এবং পুরনো রান অটো বন্ধ করার জন্য
concurrency:
  group: mac-runner-session
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-mac:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Clean Old Runs
        run: |
          echo "🧹 পুরনো জবের হিস্ট্রি মেমোরি থেকে মোছা হচ্ছে..."
          gh run list --status completed --limit 10 --json databaseId -q '.[].databaseId' | while read -r run_id; do
            gh run delete "$run_id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto Run command.txt & Infinite Loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          # ১. command.txt থেকে অটোমেটিক রান করার ফাংশন
          run_custom_command() {
            if [ -f "command.txt" ]; then
              echo "🚀 command.txt এক্সিকিউট করা হচ্ছে..."
              echo "----------------------------------------"
              cat command.txt
              echo -e "\n----------------------------------------"
              
              bash command.txt &
              CMD_PID=$!
              echo "📌 ব্যাকগ্রাউন্ড প্রসেস আইডি (PID): $CMD_PID"
            else
              echo "⚠️ command.txt ফাইলটি পাওয়া যায়নি!"
            fi
          }

          # রান শুরু
          run_custom_command

          # ২. ২৪ ঘণ্টা অটোমেটিক চালু রাখার টাইমার (Self-Restart)
          # গিটহাবের ৬ ঘণ্টার লিমিট শেষ হওয়ার আগেই (৫ ঘণ্টা ৫০ মিনিটে) এটি অটো নতুন রান চালু করবে
          (
            sleep 21000
            echo "⚠️ সেশনের সময় শেষ হয়ে আসছে! পরের সেশন স্বয়ংক্রিয়ভাবে স্টার্ট করা হচ্ছে..."
            gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}" || true
            sleep 10
            echo "✅ নতুন সেশন শুরু হয়েছে। বর্তমান সেশন ক্লিন-এক্সিট হচ্ছে..."
            kill -9 $CMD_PID 2>/dev/null || true
            exit 0
          ) &

          # ৩. Anti-Stall ও লাইভ রিলোডার লুপ
          LOOP_COUNTER=0
          while true; do
            sleep 10
            LOOP_COUNTER=$((LOOP_COUNTER+1))

            # প্রতি ৫ মিনিটে গিটহাবকে সিগন্যাল দিবে যে ওয়ার্কফ্লো সচল আছে
            if [ $LOOP_COUNTER -ge 30 ]; then
              echo "✅ [Keep-Alive] ওয়ার্কফ্লো চলছে... $(date)"
              LOOP_COUNTER=0
            fi

            # আপনি কখনো command.txt পরিবর্তন করলে কোনো কিছু রিস্টার্ট ছাড়াই সাথে সাথে নতুন কমান্ড নিয়ে নিবে
            git fetch origin "${{ github.ref_name }}" -q 2>/dev/null || true
            LOCAL=$(git rev-parse HEAD 2>/dev/null || true)
            REMOTE=$(git rev-parse @{u} 2>/dev/null || echo "$LOCAL")

            if [ -n "$LOCAL" ] && [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
              echo "⚡ command.txt ফাইলে আপডেট পাওয়া গেছে! নতুন কোড রিলোড হচ্ছে..."
              git reset --hard @{u} -q || true
              kill -9 $CMD_PID 2>/dev/null || true
              sleep 2
              run_custom_command
            fi
          done
